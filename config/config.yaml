# orka user defaults
#
# Copy this file to ${XDG_CONFIG_HOME:-~/.config}/orka/config.yaml
#
# Values here act as defaults: any flag supplied on the command line or via
# environment variable takes precedence over what is set here.
#
# Supported keys:
#
#   engine          - container engine binary to use (docker | podman | container | bubblewrap)
#                     `container` is Apple's CLI on macOS; support is alpha
#   harness         - agent harness to launch          (pi | claude | codex)
#   harness-version - harness version to install        (e.g. 1.2.3; pi harness only)
#   pi-path         - absolute path to the pi binary    (bubblewrap backend only)
#   claude-path     - absolute path to the claude binary (bubblewrap backend only)
#   codex-path      - absolute path to the codex binary  (bubblewrap backend only)
#   harness-args    - extra arguments per harness, forwarded to the agent ahead of
#                     anything passed after `--` on the command line
#   preset          - always-on presets, applied to every run (same as repeating
#                     --preset); repeating one of these on the command line is a
#                     no-op rather than a duplicate mount
#   env             - KEY=VALUE pairs injected into every run (same as --env)
#   volume          - host paths mounted on every run (same as --volume); a bare
#                     path is mounted at the same absolute path in the container,
#                     or use host:container to set the destination
#   no-cache        - always rebuild the image            (true | false)
#   verbose         - always pass VERBOSE=1 into the container (true | false)
#   quiet           - always suppress image build output  (true | false)
#   preserve-container - keep containers after they exit  (true | false)

# engine: podman
# harness: pi
# harness-version: latest

# harness-args:
