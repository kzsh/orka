# cargo-about configuration
# Run scripts/gen-licenses.sh to regenerate THIRD_PARTY_LICENSES.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
]

# orka is not published to crates.io (publish = false in Cargo.toml).
# Exclude it from third-party license output; PUBLIC-LICENSE covers it.
private = { ignore = true }

